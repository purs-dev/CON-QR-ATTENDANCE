<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scanner | CON Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-announcement">
  <div class="marquee-wrapper">
    <span>NURSING SESSION 2026&nbsp;•&nbsp;OFFICIAL ATTENDANCE GATEWAY&nbsp;•&nbsp;SPCF COLLEGE OF NURSING&nbsp;•&nbsp;</span>
    <span>NURSING SESSION 2026&nbsp;•&nbsp;OFFICIAL ATTENDANCE GATEWAY&nbsp;•&nbsp;SPCF COLLEGE OF NURSING&nbsp;•&nbsp;</span>
  </div>
</div>

<div class="container" style="max-width:520px;">
  <header class="main-header text-center">
    <div class="logo-wrap justify-content-center">
      <img src="images/CON_NEW_LOGO.png" alt="Logo" class="main-logo" onerror="this.style.display='none'">
      <span class="dept-name">SPCF / NURSING — SCANNER</span>
    </div>
    <h1 class="page-title" style="font-size:clamp(30px,8vw,48px);">Attendance<br><span class="outline">Scanner</span></h1>
  </header>

  <main class="pb-5">
    <div class="scan-frame">
      <div id="reader"></div>
      <div id="scanFlash" class="scan-result-flash" style="display:none;"></div>

      <div class="mt-4">
        <h3 class="session-tag mb-2" style="margin-bottom:8px;">Recent Check-ins</h3>
        <div id="recentList"><p class="small text-body-secondary">No scans yet.</p></div>
      </div>

      <div class="manual-panel">
        <p class="small text-body-secondary mb-2">Camera not cooperating? Check a student in manually.</p>
        <div class="mb-2">
          <label class="form-label">Session</label>
          <select class="form-select" id="manualSession"><option value="">— Select a session —</option></select>
        </div>
        <div class="d-flex gap-2">
          <input type="text" class="form-control" id="manualStudentId" placeholder="Student ID">
          <button class="btn btn-primary" id="manualBtn" style="white-space:nowrap;">Check In</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" id="toastStack" style="z-index:1080;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/scanner.js"></script>
</body>
</html>
